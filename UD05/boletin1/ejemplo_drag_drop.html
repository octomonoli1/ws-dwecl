<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Ejemplo Drag Drop</title>
    <script src='ejemplo_drag_drop.js'></script>
</head>
<body>
    <h1>Ejemplo Drag & Drop</h1>
    <div class="caja" style="border: solid 1px;">
        <h2>Por hacer ...</h2>
        <div class="task" draggable="true" style="width: 50%;">
            <h3>Tarea 1</h3>
            <p>Esto es un ejemplo de tarea</p>
        </div>
    </div>
    <div class="caja" style="border: solid 1px;">
        <h2>En proceso ...</h2>
        <div class="task" draggable="true" style="width: 50%;">
            <h3>Tarea 2</h3>
            <p>Esto es un ejemplo de tarea</p>
        </div>
    </div>
    <div class="caja" style="border: solid 1px;">
        <h2>Finalizado ...</h2>
        <div class="task" draggable="true"   style="width: 50%;">
            <h3>Tarea 3</h3>
            <p>Esto es un ejemplo de tarea</p>
        </div>
    </div>
</body>
</html>
